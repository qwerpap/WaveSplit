name: wave_split
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dio: ^5.9.0
  get_it: ^9.1.0
  flutter_svg: ^2.2.3
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  go_router: ^17.0.0
  liquid_glass_renderer: ^0.2.0-dev.4
  file_selector: ^1.1.0
  file_picker: ^8.3.7
  url_launcher: ^6.1.10
  audioplayers: ^6.1.0
  talker_flutter: ^5.1.7
  path_provider: ^2.1.1
  crypto: ^3.0.3
  shared_preferences: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/png/
    - assets/svg/
    - assets/svg/navigation/
    - assets/fonts/
    - assets/audio/

  fonts:
    - family: Rubik
      fonts:
        - asset: assets/fonts/Rubik-Medium.ttf
